name: Athena Upstream Sync

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      auto_release:
        description: "Automatically tag and build a new Athena release when upstream merges cleanly"
        required: false
        default: true
        type: boolean
      skip_verify:
        description: "Skip typecheck and Athena test verification before pushing (emergency only)"
        required: false
        default: false
        type: boolean

concurrency:
  group: athena-upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    name: Sync pingdotgg/t3code main into Athena
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      released: ${{ steps.publish.outputs.released }}
      tag: ${{ steps.publish.outputs.tag }}
      sha: ${{ steps.publish.outputs.sha }}
      notes: ${{ steps.publish.outputs.notes }}
    steps:
      - name: Checkout origin main (treeless, excluding .repos)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git remote add upstream "https://github.com/pingdotgg/t3code.git"
          git sparse-checkout set --no-cone '/*' '!/.repos/' '!/apps/mobile/modules/t3-terminal/Vendor/**/*.a'
          git fetch --filter=blob:none --tags origin main
          git checkout -B main FETCH_HEAD
          git fetch --no-tags upstream main

      - name: Merge upstream/main locally
        id: merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "merged=false" >> "$GITHUB_OUTPUT"

          behind_count="$(git rev-list --count HEAD..upstream/main)"
          if [[ "$behind_count" -eq 0 ]]; then
            echo "Already up to date with pingdotgg/t3code main."
            exit 0
          fi

          upstream_sha="$(git rev-parse --short upstream/main)"
          echo "Found ${behind_count} new upstream commit(s) (head ${upstream_sha})."

          git config user.name "athena-sync[bot]"
          git config user.email "athena-sync[bot]@users.noreply.github.com"

          summary="$(git log --no-merges --pretty=format:'- %s (%h)' -n 20 HEAD..upstream/main || true)"
          if [[ "$behind_count" -gt 20 ]]; then
            summary="$(printf '%s\n- ...and %d more upstream commits\n' "$summary" "$((behind_count - 20))")"
          fi

          if ! git merge --no-edit -m "chore(sync): merge upstream pingdotgg/t3code (${upstream_sha})" upstream/main; then
            conflict_files="$(git diff --name-only --diff-filter=U || true)"
            git merge --abort || true

            issue_title="Upstream sync conflict with pingdotgg/t3code"
            issue_body="$(printf '%s\n\n### Conflicting files\n```\n%s\n```\n\n### Upstream commits waiting (%s, head `%s`)\n%s\n\n### Resolve locally\n```bash\ngit fetch upstream main && git merge upstream/main\n```\n' \
              'Automated sync from `pingdotgg/t3code` (`main`) hit merge conflicts and left `main` untouched.' \
              "${conflict_files:-<unknown>}" \
              "$behind_count" \
              "$upstream_sha" \
              "${summary:-<no non-merge commits>}")"

            printf '## %s\n\n%s\n' "$issue_title" "$issue_body" >> "$GITHUB_STEP_SUMMARY"

            issues_enabled="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.has_issues' 2>/dev/null || echo false)"
            if [[ "$issues_enabled" == "true" ]]; then
              existing_issue="$(gh issue list --state open --search "\"${issue_title}\" in:title" --json number --jq '.[0].number // empty' || true)"
              if [[ -n "$existing_issue" ]]; then
                gh issue comment "$existing_issue" --body "$issue_body"
              else
                gh issue create --title "$issue_title" --body "$issue_body"
              fi
              echo "Merge conflict recorded in job summary and GitHub issue; exiting cleanly without breaking main."
              exit 0
            fi

            echo "::error::Upstream sync hit merge conflicts (${behind_count} commits waiting at ${upstream_sha}). GitHub Issues are disabled on ${GITHUB_REPOSITORY}; see the job summary for conflicting files."
            exit 1
          fi

          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "behind_count=${behind_count}" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=${upstream_sha}" >> "$GITHUB_OUTPUT"
          {
            echo "summary<<EOF_ATHENA_SYNC_SUMMARY"
            echo "${summary:-- Upstream updates}"
            echo "EOF_ATHENA_SYNC_SUMMARY"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Vite+
        if: steps.merge.outputs.merged == 'true' && (github.event_name == 'schedule' || inputs.skip_verify != true)
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Verify merged commit before pushing
        id: verify
        if: steps.merge.outputs.merged == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP_VERIFY: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_verify == true }}
          BEHIND_COUNT: ${{ steps.merge.outputs.behind_count }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
          SUMMARY: ${{ steps.merge.outputs.summary }}
        run: |
          set -euo pipefail
          if [[ "$SKIP_VERIFY" == "true" ]]; then
            echo "Verification skipped by manual workflow_dispatch input."
            echo "passed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          log_file="$(mktemp)"
          set +e
          {
            echo "=== Install dependencies ==="
            vp install --frozen-lockfile && \
            echo "=== Typecheck ===" && \
            vp run typecheck && \
            echo "=== Athena guardrail tests ===" && \
            vp test run \
              apps/web/src/components/athena/AthenaRightSide.test.ts \
              apps/desktop/src/app/DesktopAppIdentity.test.ts \
              scripts/athena-doctor.test.ts
          } >"$log_file" 2>&1
          status=$?
          set -e

          cat "$log_file"

          if [[ "$status" -ne 0 ]]; then
            tail_log="$(tail -n 80 "$log_file")"
            issue_title="Upstream sync verification failed with pingdotgg/t3code"
            issue_body="$(printf '%s\n\n### Failure tail\n```text\n%s\n```\n\n### Upstream commits waiting (%s, head `%s`)\n%s\n\n### Reproduce locally\n```bash\ngit fetch upstream main && git merge upstream/main && vp run typecheck\n```\n' \
              'Automated sync from `pingdotgg/t3code` (`main`) merged cleanly in git, but failed typecheck or Athena guardrail tests. `main` was left untouched and no release was cut.' \
              "$tail_log" \
              "$BEHIND_COUNT" \
              "$UPSTREAM_SHA" \
              "$SUMMARY")"

            printf '## %s\n\n%s\n' "$issue_title" "$issue_body" >> "$GITHUB_STEP_SUMMARY"
            echo "passed=false" >> "$GITHUB_OUTPUT"

            issues_enabled="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.has_issues' 2>/dev/null || echo false)"
            if [[ "$issues_enabled" == "true" ]]; then
              existing_issue="$(gh issue list --state open --search "\"${issue_title}\" in:title" --json number --jq '.[0].number // empty' || true)"
              if [[ -n "$existing_issue" ]]; then
                gh issue comment "$existing_issue" --body "$issue_body"
              else
                gh issue create --title "$issue_title" --body "$issue_body"
              fi
              echo "::warning::Upstream sync verification failed; details recorded in job summary and GitHub issue and main was left untouched."
              exit 0
            fi

            echo "::error::Upstream sync verification failed (${BEHIND_COUNT} commits waiting at ${UPSTREAM_SHA}). GitHub Issues are disabled on ${GITHUB_REPOSITORY}; see the job summary for failure details."
            exit 1
          fi

          echo "passed=true" >> "$GITHUB_OUTPUT"

      - name: Push verified main and tag release
        id: publish
        if: steps.merge.outputs.merged == 'true' && steps.verify.outputs.passed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_RELEASE: ${{ github.event_name == 'schedule' || inputs.auto_release }}
          BEHIND_COUNT: ${{ steps.merge.outputs.behind_count }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
          SUMMARY: ${{ steps.merge.outputs.summary }}
        run: |
          set -euo pipefail
          echo "released=false" >> "$GITHUB_OUTPUT"

          git push origin main
          new_sha="$(git rev-parse HEAD)"

          # Close any open upstream-sync conflict or verification-failure issues now that main verified cleanly.
          issues_enabled="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.has_issues' 2>/dev/null || echo false)"
          if [[ "$issues_enabled" == "true" ]]; then
            for title in \
              "Upstream sync conflict with pingdotgg/t3code" \
              "Upstream sync verification failed with pingdotgg/t3code"
            do
              existing_issue="$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty' || true)"
              if [[ -n "$existing_issue" ]]; then
                gh issue close "$existing_issue" --comment "Resolved and verified cleanly in ${new_sha}." || true
              fi
            done
          fi

          release_line="- **Release tag:** skipped (\`auto_release=false\`)"
          if [[ "$AUTO_RELEASE" == "true" ]]; then
            # Use monotonic 3-part stable semver (v1.0.N) so electron-updater on the latest channel
            # always treats each synced Athena build as newer than v0.1.x and prior v1.0.N builds.
            last_patch="$(git tag -l 'v1.0.*' | sed -E 's/^v1\.0\.([0-9]+)$/\1/' | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)"
            next_patch="$(( ${last_patch:-0} + 1 ))"
            next_tag="v1.0.${next_patch}"

            git tag "$next_tag" "$new_sha"
            git push origin "$next_tag"

            release_notes="$(printf '### Synced from `pingdotgg/t3code` (`%s`, %s new commit(s))\n%s' \
              "$UPSTREAM_SHA" \
              "$BEHIND_COUNT" \
              "$SUMMARY")"

            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=${next_tag}" >> "$GITHUB_OUTPUT"
            echo "sha=${new_sha}" >> "$GITHUB_OUTPUT"
            {
              echo "notes<<EOF_ATHENA_RELEASE_NOTES"
              echo "$release_notes"
              echo "EOF_ATHENA_RELEASE_NOTES"
            } >> "$GITHUB_OUTPUT"
            release_line="- **Release tag:** \`${next_tag}\`"
          else
            echo "Merged and verified cleanly (${new_sha}); auto_release=false so skipping tag."
          fi

          {
            echo "### Athena Upstream Sync Succeeded"
            echo ""
            echo "- **Synced commit:** \`${new_sha}\`"
            echo "- **Upstream \`pingdotgg/t3code\`:** \`${UPSTREAM_SHA}\` (${BEHIND_COUNT} commit(s))"
            echo "$release_line"
            echo ""
            echo "#### Upstream commits merged"
            echo "$SUMMARY"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: sync
    if: needs.sync.outputs.released == 'true'
    uses: ./.github/workflows/athena-desktop-release.yml
    with:
      tag: ${{ needs.sync.outputs.tag }}
      sha: ${{ needs.sync.outputs.sha }}
      platform: both
      notes: ${{ needs.sync.outputs.notes }}
    secrets: inherit
