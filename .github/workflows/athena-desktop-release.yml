name: Athena Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub release tag to create or upload installers to (e.g. v1.0.1)"
        required: true
        type: string
      platform:
        description: "Which platform(s) to build"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - windows
          - macos
  workflow_call:
    inputs:
      tag:
        description: "GitHub release tag to create or upload installers to (e.g. v1.0.1)"
        required: true
        type: string
      sha:
        description: "Commit SHA to build (defaults to github.sha)"
        required: false
        default: ""
        type: string
      platform:
        description: "Which platform(s) to build (both, windows, or macos)"
        required: false
        default: "both"
        type: string
      notes:
        description: "Optional extra release notes to prepend"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    if: github.event_name == 'push' || inputs.platform == 'both' || inputs.platform == 'windows'
    name: Build Windows x64 (.exe)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
          TARGET_SHA: ${{ inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${TARGET_SHA}"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        shell: bash
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Build Windows installer (.exe)
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cp .env.example .env
          build_version="${RELEASE_TAG#v}"
          vp run dist:desktop:artifact --platform win --target nsis --arch x64 --build-version "$build_version" --output-dir release --verbose

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: athena-windows-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

      - name: Upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          TARGET_SHA: ${{ inputs.sha || github.sha }}
          EXTRA_NOTES: ${{ inputs.notes || '' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            release_notes="$(printf '%s\n\n%s\n' \
              'Athena desktop builds (Windows x64 + macOS Apple Silicon).' \
              'If macOS Gatekeeper blocks the unsigned app after dragging Athena.app into Applications, run once in Terminal: `xattr -cr /Applications/Athena.app`')"
            if [[ -n "$EXTRA_NOTES" ]]; then
              release_notes="$(printf '%s\n\n%s\n' "$EXTRA_NOTES" "$release_notes")"
            fi
            gh release create "$RELEASE_TAG" --target "${TARGET_SHA}" --title "Athena ${RELEASE_TAG}" --notes "$release_notes" || true
          fi
          files=(release/*.exe release/*.blockmap release/latest*.yml)
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber

  build-macos:
    if: github.event_name == 'push' || inputs.platform == 'both' || inputs.platform == 'macos'
    name: Build macOS arm64 (.dmg)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
          TARGET_SHA: ${{ inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${TARGET_SHA}"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        shell: bash
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Build macOS installer (.dmg)
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          cp .env.example .env
          build_version="${RELEASE_TAG#v}"
          signed_args=()
          if [[ -n "${CSC_LINK:-}" ]]; then
            signed_args+=(--signed)
          fi
          vp run dist:desktop:artifact --platform mac --target dmg --arch arm64 --build-version "$build_version" --output-dir release --verbose "${signed_args[@]}"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: athena-macos-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

      - name: Upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          TARGET_SHA: ${{ inputs.sha || github.sha }}
          EXTRA_NOTES: ${{ inputs.notes || '' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            release_notes="$(printf '%s\n\n%s\n' \
              'Athena desktop builds (Windows x64 + macOS Apple Silicon).' \
              'If macOS Gatekeeper blocks the unsigned app after dragging Athena.app into Applications, run once in Terminal: `xattr -cr /Applications/Athena.app`')"
            if [[ -n "$EXTRA_NOTES" ]]; then
              release_notes="$(printf '%s\n\n%s\n' "$EXTRA_NOTES" "$release_notes")"
            fi
            gh release create "$RELEASE_TAG" --target "${TARGET_SHA}" --title "Athena ${RELEASE_TAG}" --notes "$release_notes" || true
          fi
          files=(release/*.dmg release/*.zip release/*.blockmap release/latest*.yml)
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
