name: Athena Desktop Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub release tag to create or upload installers to (e.g. v0.1.11-athena.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 (.exe)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        shell: bash
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Build Windows installer (.exe)
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          vp run dist:desktop:artifact --platform win --target nsis --arch x64 --output-dir release --verbose

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: athena-windows-x64
          path: release/*.exe
          if-no-files-found: error

      - name: Upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "${GITHUB_SHA}" --title "Athena ${RELEASE_TAG}" --notes "Athena desktop builds (Windows x64 + macOS Apple Silicon)." || true
          fi
          gh release upload "$RELEASE_TAG" release/*.exe --clobber

  build-macos:
    name: Build macOS arm64 (.dmg)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        shell: bash
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Build macOS installer (.dmg)
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          vp run dist:desktop:artifact --platform mac --target dmg --arch arm64 --output-dir release --verbose

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: athena-macos-arm64
          path: release/*.dmg
          if-no-files-found: error

      - name: Upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "${GITHUB_SHA}" --title "Athena ${RELEASE_TAG}" --notes "Athena desktop builds (Windows x64 + macOS Apple Silicon)." || true
          fi
          gh release upload "$RELEASE_TAG" release/*.dmg --clobber
