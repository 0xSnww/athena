name: Athena Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub release tag to create or upload installers to (e.g. v1.0.1 or v1.0.2-beta.1)"
        required: true
        type: string
      sha:
        description: "Commit SHA to build (defaults to branch head)"
        required: false
        default: ""
        type: string
      platform:
        description: "Which platform(s) to build"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - windows
          - macos
      macos_runner:
        description: "GitHub runner label for the macOS build"
        required: false
        default: "macos-26"
        type: choice
        options:
          - macos-26
          - macos-15
          - macos-latest
          - self-hosted
      prerelease:
        description: "Mark the GitHub release as a prerelease (auto-enabled for tags containing '-')"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      tag:
        description: "GitHub release tag to create or upload installers to (e.g. v1.0.1)"
        required: true
        type: string
      sha:
        description: "Commit SHA to build (defaults to github.sha)"
        required: false
        default: ""
        type: string
      platform:
        description: "Which platform(s) to build (both, windows, or macos)"
        required: false
        default: "both"
        type: string
      macos_runner:
        description: "GitHub runner label for the macOS build"
        required: false
        default: "macos-26"
        type: string
      notes:
        description: "Optional extra release notes to prepend"
        required: false
        default: ""
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: false
        default: false
        type: boolean

concurrency:
  group: athena-desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-windows:
    if: github.event_name == 'push' || inputs.platform == 'both' || inputs.platform == 'windows'
    name: Build Windows x64 (.exe)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
          TARGET_SHA: ${{ inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${TARGET_SHA}"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        shell: bash
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Build Windows installer (.exe)
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cp .env.example .env
          build_version="${RELEASE_TAG#v}"
          vp run dist:desktop:artifact --platform win --target nsis --arch x64 --build-version "$build_version" --output-dir release --verbose
          test -f release/latest.yml

      - name: Verify artifacts and generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(release/*.exe)
          if [[ "${#installers[@]}" -eq 0 ]]; then
            echo "::error::Expected at least one Windows .exe installer in release/."
            exit 1
          fi
          (cd release && sha256sum *.exe > SHA256SUMS-windows-x64.txt)
          cat release/SHA256SUMS-windows-x64.txt

      - name: Upload Windows artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: athena-windows-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
            release/SHA256SUMS-windows-x64.txt
          if-no-files-found: error

  build-macos:
    if: github.event_name == 'push' || inputs.platform == 'both' || inputs.platform == 'macos'
    name: Build macOS arm64 (.dmg)
    runs-on: ${{ inputs.macos_runner || 'macos-26' }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Select Xcode 26 if installed
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for app in /Applications/Xcode_26*.app /Applications/Xcode.app; do
            if [[ -d "$app/Contents/Developer" ]]; then
              sudo xcode-select -s "$app/Contents/Developer" || true
              break
            fi
          done
          xcodebuild -version || true

      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
          TARGET_SHA: ${{ inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${TARGET_SHA}"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Install dependencies
        shell: bash
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Build macOS installer (.dmg)
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          cp .env.example .env
          build_version="${RELEASE_TAG#v}"
          if [[ -n "${CSC_LINK:-}" ]]; then
            vp run dist:desktop:artifact --platform mac --target dmg --arch arm64 --build-version "$build_version" --output-dir release --verbose --signed
          else
            vp run dist:desktop:artifact --platform mac --target dmg --arch arm64 --build-version "$build_version" --output-dir release --verbose
          fi
          test -f release/latest-mac.yml

      - name: Verify artifacts and generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(release/*.dmg release/*.zip)
          if [[ "${#installers[@]}" -eq 0 ]]; then
            echo "::error::Expected macOS .dmg/.zip installers in release/."
            exit 1
          fi
          (cd release && shasum -a 256 *.dmg *.zip > SHA256SUMS-macos-arm64.txt)
          cat release/SHA256SUMS-macos-arm64.txt

      - name: Upload macOS artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: athena-macos-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
            release/SHA256SUMS-macos-arm64.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    if: >-
      always() && (
        ((github.event_name == 'push' || inputs.platform == 'both') && needs.build-windows.result == 'success' && needs.build-macos.result == 'success') ||
        (github.event_name != 'push' && inputs.platform == 'windows' && needs.build-windows.result == 'success') ||
        (github.event_name != 'push' && inputs.platform == 'macos' && needs.build-macos.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: staged-release
          merge-multiple: true

      - name: Assemble checksums and publish release atomically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          TARGET_SHA: ${{ inputs.sha || github.sha }}
          EXTRA_NOTES: ${{ inputs.notes || '' }}
          EXPLICIT_PRERELEASE: ${{ inputs.prerelease == true }}
          EXPECT_WINDOWS: ${{ github.event_name == 'push' || inputs.platform == 'both' || inputs.platform == 'windows' }}
          EXPECT_MACOS: ${{ github.event_name == 'push' || inputs.platform == 'both' || inputs.platform == 'macos' }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          cd staged-release
          if [[ "$EXPECT_WINDOWS" == "true" ]]; then
            win_exes=(*.exe)
            if [[ ! -f latest.yml || "${#win_exes[@]}" -eq 0 ]]; then
              echo "::error::Expected Windows release assets (latest.yml + *.exe) are missing."
              exit 1
            fi
          fi
          if [[ "$EXPECT_MACOS" == "true" ]]; then
            mac_dmgs=(*.dmg)
            mac_zips=(*.zip)
            if [[ ! -f latest-mac.yml || "${#mac_dmgs[@]}" -eq 0 || "${#mac_zips[@]}" -eq 0 ]]; then
              echo "::error::Expected macOS release assets (latest-mac.yml + *.dmg + *.zip) are missing."
              exit 1
            fi
          fi

          release_exists="false"
          if gh release view "$RELEASE_TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            release_exists="true"
          fi

          checksum_parts=(SHA256SUMS-*.txt)
          if [[ "${#checksum_parts[@]}" -gt 0 ]]; then
            new_sums="$(mktemp)"
            sums_dir="$(mktemp -d)"
            cat "${checksum_parts[@]}" > "$new_sums"
            rm -f "${checksum_parts[@]}"
            if [[ "$release_exists" == "true" ]]; then
              gh release download "$RELEASE_TAG" --repo "${GITHUB_REPOSITORY}" --pattern "SHA256SUMS.txt" --dir "$sums_dir" 2>/dev/null || true
            fi
            if [[ -s "$new_sums" && -s "${sums_dir}/SHA256SUMS.txt" ]]; then
              awk 'NR == FNR { seen[$2] = 1; next } NF >= 2 && !($2 in seen) { print }' "$new_sums" "${sums_dir}/SHA256SUMS.txt" | cat - "$new_sums" | sort -k2 > SHA256SUMS.txt
            else
              sort -k2 "$new_sums" > SHA256SUMS.txt
            fi
            rm -rf "$new_sums" "$sums_dir"
          fi

          files=(*.exe *.dmg *.zip *.blockmap latest*.yml SHA256SUMS.txt)
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "::error::No release files found to publish."
            exit 1
          fi

          is_prerelease="false"
          if [[ "$EXPLICIT_PRERELEASE" == "true" || "$RELEASE_TAG" == *-* ]]; then
            is_prerelease="true"
          fi

          release_notes="$(printf '%s\n\n%s\n' \
            'Athena desktop builds (Windows x64 + macOS Apple Silicon).' \
            'If macOS Gatekeeper blocks the unsigned app after dragging Athena.app into Applications, run once in Terminal: `xattr -cr /Applications/Athena.app`')"
          if [[ -n "$EXTRA_NOTES" ]]; then
            release_notes="$(printf '%s\n\n%s\n' "$EXTRA_NOTES" "$release_notes")"
          fi

          if [[ "$release_exists" != "true" ]]; then
            create_args=(
              "$RELEASE_TAG"
              --repo "${GITHUB_REPOSITORY}"
              --target "${TARGET_SHA}"
              --title "Athena ${RELEASE_TAG}"
              --notes "$release_notes"
              --draft
            )
            if [[ "$is_prerelease" == "true" ]]; then
              create_args+=(--prerelease)
            fi
            gh release create "${create_args[@]}"
          fi

          gh release upload "$RELEASE_TAG" "${files[@]}" --repo "${GITHUB_REPOSITORY}" --clobber

          edit_args=(
            "$RELEASE_TAG"
            --repo "${GITHUB_REPOSITORY}"
            --draft=false
          )
          if [[ "$is_prerelease" == "true" ]]; then
            edit_args+=(--prerelease)
          fi
          gh release edit "${edit_args[@]}"
